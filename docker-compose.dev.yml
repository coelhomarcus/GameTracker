# Somente para desenvolvimento local. Em produção, Postgres e Redis já rodam
# no Dokploy (VPS) como serviços gerenciados — este compose não é usado lá.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gametracker
      POSTGRES_PASSWORD: gametracker_dev_password
      POSTGRES_DB: gametracker
    ports:
      - "5432:5432"
    volumes:
      - gametracker_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gametracker_redis_data:/data

volumes:
  gametracker_pg_data:
  gametracker_redis_data:
