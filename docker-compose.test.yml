# Postgres e Redis só para os testes (portas diferentes do docker-compose.dev.yml para poder
# rodar os dois ao mesmo tempo). Os dados são descartáveis: nada aqui é compartilhado.
#   cd backend && npm run test:db:up
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gametracker
      POSTGRES_PASSWORD: gt_test_dev
      POSTGRES_DB: gametracker_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gametracker -d gametracker_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
